services:
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"  # Host port 5433 mapped to container 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: